name: ci
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - ready_for_review
      - synchronize
      - reopened
  merge_group:
  push:
    branches:
      - main

jobs:
  api-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./api

      - name: Run eslint
        run: npm run lint
        working-directory: ./api

  api-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: ./api

      - name: Copy environment variables
        run: cp sample.env .env
        working-directory: ./api

      - name: Setup docker compose
        uses: docker/setup-buildx-action@v2

      - name: Start docker and wait db is ready
        run: |
          docker compose up -d --build
          sleep 5

      - name: Run unit tests
        run: npm run test:unit
        working-directory: ./api

      - name: Run integration tests
        run: npm run test:integration
        working-directory: ./api

      - name: Run acceptance tests
        run: npm run test:acceptance
        working-directory: ./api

  web-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./web

      - name: Run eslint
        run: npm run lint
        working-directory: ./web

  web-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./web

      - name: Copy environment variables
        run: cp sample.env .env
        working-directory: ./web

      - name: Run tests
        run: npm test
        working-directory: ./web


  cli-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./cli

      - name: Run eslint
        run: npm run lint
        working-directory: ./cli

  cli-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./cli

      - name: Run tests
        run: npm test
        working-directory: ./cli
