services:
  postgres:
    image: postgres:18.1-alpine
    container_name: feedback-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: feedback
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    networks:
      - feedback-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: feedback-api-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/feedback
      PORT: 3000
      LOG_ENABLED: ${LOG_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FOR_HUMANS_FORMAT: ${LOG_FOR_HUMANS_FORMAT:-false}
      DEBUG_ENABLED: ${DEBUG_ENABLED:-false}
      PASSWORD_HASH: ${PASSWORD_HASH:-10}
      TOKEN_SECRET: ${TOKEN_SECRET:-secret}
      TOKEN_EXPIRATION: ${TOKEN_EXPIRATION:-1h}
      MAILING_ENABLED: ${MAILING_ENABLED:-false}
      MAIL_TEST_ACCOUNT_ENABLED: ${MAIL_TEST_ACCOUNT_ENABLED:-false}
      BASE_URL: ${BASE_URL:-http://localhost}
    ports:
      - "${API_PORT:-3000}:3000"
    networks:
      - feedback-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: feedback-web-prod
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - feedback-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  feedback-network:
    driver: bridge
